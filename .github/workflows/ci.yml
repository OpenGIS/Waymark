name: CI

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to WordPress.org SVN
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version_changed: ${{ steps.version_check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if version changed
        id: version_check
        run: |
          CURRENT_VERSION=$(grep -m1 'Version:' Waymark.php | awk '{print $NF}')
          DEPLOYED_VERSION=$(grep -m1 'Stable tag:' readme.txt | awk '{print $NF}')

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$DEPLOYED_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" != "$DEPLOYED_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $DEPLOYED_VERSION → $CURRENT_VERSION"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURRENT_VERSION), skipping deploy."
          fi

      - name: Set up Node
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: npm ci

      - name: Sync versions and build artefacts
        if: steps.version_check.outputs.changed == 'true'
        run: npx grunt sync_version build

      - name: Build distributable zip
        if: steps.version_check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version_check.outputs.current }}
        run: |
          mkdir -p "$RUNNER_TEMP/waymark"
          rsync -rc --exclude-from=.distignore ./ "$RUNNER_TEMP/waymark/" --delete --delete-excluded
          cd "$RUNNER_TEMP"
          rm -f "waymark-$VERSION.zip"
          zip -r -X "waymark-$VERSION.zip" waymark

      - name: Deploy to WordPress.org
        if: steps.version_check.outputs.changed == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
          SLUG: waymark
          VERSION: ${{ steps.version_check.outputs.current }}

      - name: Commit synced release files
        if: steps.version_check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.txt package.json readme.md languages/ assets/ waymark-js/dist
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync release artefacts for v${{ steps.version_check.outputs.current }}"
            git push
          fi

      - name: Create tag and release
        if: steps.version_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: master
          files: ${{ runner.temp }}/waymark-${{ env.VERSION }}.zip
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_check.outputs.current }}

  readme_assets:
    name: Deploy readme and assets to WordPress.org SVN
    needs: deploy
    if: needs.deploy.outputs.version_changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # WordPress.org serves the readme from the stable tag directory, so the
      # action commits the readme and assets to both trunk and that tag.
      - name: Deploy readme and assets to WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
          SLUG: waymark
          IGNORE_OTHER_FILES: true
